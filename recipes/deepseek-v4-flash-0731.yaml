# Recipe: DeepSeek V4 Flash 0731 with DSpark speculative decoding
# Based on community recipe from eugr/spark-vllm-docker PR #319 (bilikaz)
# Updated with gitmarecki's v2 SM120 fix and community-validated config

recipe_version: "2"
model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: vllm-ray
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest

metadata:
  description: >-
    DeepSeek V4 Flash 0731 with DSpark speculative decoding (5-token Markov draft),
    2-node tensor parallel. vLLM with Ray executor.
  model_dtype: fp8
  kv_dtype: fp8

mods:
  - mods/instanttensor-hybrid-draft-loader
  - mods/fix-dspark-sm120-topk

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.80
  max_model_len: 100000
  max_num_batched_tokens: 8192
  max_num_seqs: 4

env:
  DG_JIT_USE_NVRTC: "0"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
    --host {host} --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --kv-cache-dtype fp8_ds_mla \
    --block-size 256 \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}' \
    --tokenizer-mode deepseek_v4 \
    --distributed-executor-backend ray \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
    --default-chat-template-kwargs.thinking=true \
    --default-chat-template-kwargs.reasoning_effort=high \
    --load-format instanttensor

executor_config:
  user: root
