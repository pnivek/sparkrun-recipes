# Recipe: deepseek-ai/DeepSeek-V4-Flash-0731
# 2-node DeepSeek V4 Flash with DSpark speculative decoding on DGX Spark cluster
# Based on @eugr/deepseek-v4-flash, updated for 0731 release
# Reference: https://forums.developer.nvidia.com/t/376220 (eugr + DSpark community run)

recipe_version: "2"
model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: vllm-ray
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest

metadata:
  description: DeepSeek V4 Flash 0731 with DSpark speculation (DSpark-5), 2-node TP

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 500000
  max_num_batched_tokens: 8192
  max_num_seqs: 4
  block_size: 256
  num_speculative_tokens: 5
  kv_cache_dtype: fp8
  load_format: instanttensor
  tokenizer_mode: deepseek_v4
  tool_call_parser: deepseek_v4
  reasoning_parser: deepseek_v4

env:
  DG_JIT_USE_NVRTC: "0"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  TRANSFORMERS_OFFLINE: "1"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
    --host {host} --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --speculative-config '{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"greedy"}' \
    --tokenizer-mode {tokenizer_mode} \
    --distributed-executor-backend ray \
    --tool-call-parser {tool_call_parser} \
    --enable-auto-tool-choice \
    --reasoning-parser {reasoning_parser} \
    --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
    --load-format {load_format}
