# Recipe: DeepSeek V4 Flash 0731 — 1M context (nvfp4_ds_mla KV) on 2x DGX Spark
#
# Uses eugr's public prebuilt SparkInfer/B12X runner (Docker Hub) + three
# runtime mods from this repo that unlock nvfp4_ds_mla KV on the DSV4 path.
# Stock images without the mods cap out around ~300K with fp8_ds_mla.
# Validated: 900K-token needle-in-haystack PASS (exact recall), boot at
# max_model_len=1048576, KV pool ~2.79M tokens @ 11.1 GiB (2.66x concurrency at 1M).

recipe_version: "2"
model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: vllm-distributed
min_nodes: 2
container: eugr/spark-vllm-b12x:latest

metadata:
  description: >-
    DeepSeek V4 Flash 0731 at 1M context via nvfp4_ds_mla KV cache on the
    SparkInfer (b12x) backend, DSpark k=5 speculative decoding, InstantTensor
    weight loading, 2-node tensor parallel.
  model_dtype: fp8
  kv_dtype: fp8

mods:
  - mods/dsv4-kv-memory-estimate
  - mods/nvfp4-dsv4-kv
  - mods/sparkinfer-compressed-physical-stride

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 1048576
  max_num_batched_tokens: 8192
  max_num_seqs: 4
  max_cudagraph_capture_size: 64

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_B12X_W4A16: "1"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"
  CUTE_DSL_ARCH: "sm_121a"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  VLLM_NVFP4_GEMM_BACKEND: "flashinfer-b12x"
  VLLM_USE_FLASHINFER_MOE_FP4: "1"
  VLLM_USE_FLASHINFER_MOE_FP16: "1"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
    --host {host} --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --kv-cache-dtype nvfp4_ds_mla \
    --block-size 256 \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --no-scheduler-reserve-full-isl \
    --tokenizer-mode deepseek_v4 \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
    --default-chat-template-kwargs '{"thinking":true,"reasoning_effort":"high"}' \
    --load-format instanttensor \
    --moe-backend b12x \
    --linear-backend b12x \
    --attention-backend B12X_MLA_SPARSE \
    --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}' \
    --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'

executor_config:
  user: root
